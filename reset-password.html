<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Sathya Sai Trust</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/theme.css?v=1.0.5">
<style>
  .auth-container {
    max-width: 440px;
    margin: 0 auto 60px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 36px 32px;
    box-shadow: var(--shadow-md);
  }
  .auth-header { text-align: center; margin-bottom: 28px; }
  .auth-header h2 { font-family: var(--font-heading); color: var(--fg); font-size: 24px; margin-bottom: 8px; }
  .auth-header p  { color: var(--muted); font-size: 14px; }
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--fg); }
  .input-group input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px;
    transition: all 0.2s ease;
  }
  .input-group input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px oklch(62% 0.16 50 / 0.15);
  }
  .status-msg {
    text-align: center; margin-top: 16px;
    font-size: 14px; padding: 12px;
    border-radius: var(--radius-sm);
  }
  .status-msg.success { background: oklch(95% 0.03 140); color: oklch(40% 0.12 140); border: 1px solid oklch(85% 0.07 140); }
  .status-msg.error   { background: oklch(96% 0.03 20);  color: oklch(40% 0.15 20);  border: 1px solid oklch(85% 0.07 20); }
</style>
</head>
<body>

<!-- Nav -->
<nav>
  <div class="container">
    <a href="index.html" class="nav-brand">
      <img src="logo.jpg" alt="SSPK" class="nav-logo-img">
      SSPK
    </a>
  </div>
</nav>

<!-- Page header -->
<section class="page-header">
  <h1>Set New Password</h1>
  <p>Enter and confirm your new password below.</p>
</section>

<section class="section" style="padding-top:0;">
  <div class="container">
    <div class="auth-container">
      <div class="auth-header">
        <h2>🔐 Reset Password</h2>
        <p>Choose a strong new password for your account.</p>
      </div>

      <div id="resetFormWrap">
        <div class="input-group">
          <label for="newPassword">New Password <span style="color:var(--danger)">*</span></label>
          <input type="password" id="newPassword" placeholder="Minimum 8 characters" required>
        </div>
        <div class="input-group">
          <label for="confirmPassword">Confirm Password <span style="color:var(--danger)">*</span></label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your new password" required>
        </div>
        <button id="resetBtn" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;">
          Update Password
        </button>
        <div id="statusMsg"></div>
      </div>

      <div id="successWrap" class="hidden" style="text-align:center; padding: 20px 0;">
        <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
        <h3 style="color: var(--accent-dark); font-family: var(--font-heading); margin-bottom: 8px;">Password Updated!</h3>
        <p style="color: var(--muted); font-size: 14px; margin-bottom: 24px;">Your password has been changed. You can now sign in with your new password.</p>
        <a href="login.html" class="btn btn-primary" style="display:inline-flex;">Go to Sign In</a>
      </div>
    </div>
  </div>
</section>

<script src="js/supabase-client.js?v=1.0.7"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const resetBtn     = document.getElementById('resetBtn');
  const statusMsg    = document.getElementById('statusMsg');
  const resetFormWrap = document.getElementById('resetFormWrap');
  const successWrap  = document.getElementById('successWrap');

  // Supabase picks up the recovery token from the URL hash automatically
  supabase.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Token is valid — let the user set a new password
      resetBtn?.addEventListener('click', async () => {
        const newPwd  = document.getElementById('newPassword').value;
        const confPwd = document.getElementById('confirmPassword').value;

        if (!newPwd || newPwd.length < 8) {
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = '⚠️ Password must be at least 8 characters.';
          return;
        }
        if (newPwd !== confPwd) {
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = '⚠️ Passwords do not match. Please try again.';
          return;
        }

        resetBtn.textContent = 'Updating...';
        resetBtn.disabled = true;

        const { error } = await supabase.auth.updateUser({ password: newPwd });

        if (error) {
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = '❌ Error: ' + error.message;
          resetBtn.textContent = 'Update Password';
          resetBtn.disabled = false;
        } else {
          resetFormWrap.classList.add('hidden');
          successWrap.classList.remove('hidden');
          // Sign out so they log in fresh with new password
          await supabase.auth.signOut();
        }
      });
    } else if (!session) {
      // No recovery token — show error
      statusMsg.className = 'status-msg error';
      statusMsg.textContent = '❌ Invalid or expired reset link. Please request a new one from the Sign In page.';
      resetBtn.disabled = true;
    }
  });
});
</script>
</body>
</html>
