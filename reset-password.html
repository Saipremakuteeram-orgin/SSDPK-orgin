<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Sathya Sai Trust</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/theme.css?v=1.1.0">
<link rel="stylesheet" href="css/divine.css?v=1.0.0">
<style>
  .auth-container {
    max-width: 440px;
    margin: 0 auto 60px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 36px 32px;
    box-shadow: var(--shadow-md);
  }
  .auth-header { text-align: center; margin-bottom: 28px; }
  .auth-header h2 { font-family: var(--font-heading); color: var(--fg); font-size: 24px; margin-bottom: 8px; }
  .auth-header p  { color: var(--muted); font-size: 14px; }
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--fg); }
  .input-group input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px;
    transition: all 0.2s ease;
  }
  .input-group input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px oklch(62% 0.16 50 / 0.15);
  }
  .status-msg {
    text-align: center; margin-top: 16px;
    font-size: 14px; padding: 12px;
    border-radius: var(--radius-sm);
  }
  .status-msg.success { background: oklch(95% 0.03 140); color: oklch(40% 0.12 140); border: 1px solid oklch(85% 0.07 140); }
  .status-msg.error   { background: oklch(96% 0.03 20);  color: oklch(40% 0.15 20);  border: 1px solid oklch(85% 0.07 20); }
  .pwd-wrap { position: relative; }
  .pwd-wrap input { padding-right: 42px; width: 100%; }
  .pwd-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 0;
    color: var(--muted); display: flex; align-items: center;
    transition: color 0.2s;
  }
  .pwd-toggle:hover { color: var(--accent); }
</style>
</head>
<body>

<!-- Nav -->
<nav>
  <div class="container">
    <a href="index.html" class="nav-brand">
      <img src="logo.jpg" alt="SSPK" class="nav-logo-img">
      SSPK
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">&#9776;</button>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="about.html">Activities</a>
      <a href="trustees.html">Trustees</a>
      <a href="gallery.html">Gallery</a>
      <a href="events.html">Events</a>
      <a href="dashboard.html" class="donate-btn">Dashboard</a>
    </div>
  </div>
</nav>

<!-- Page header -->
<section class="page-header" data-animate="fade-up">
  <h1>Set New Password</h1>
  <p>Enter and confirm your new password below.</p>
</section>

<section class="section" style="padding-top:0;">
  <div class="container">
    <div class="auth-container" data-animate="scale-in">
      <div class="auth-header">
        <h2>🔐 Reset Password</h2>
        <p>Choose a strong new password for your account.</p>
      </div>

      <div id="resetFormWrap">
        <div class="input-group">
          <label for="newPassword">New Password <span style="color:var(--danger)">*</span></label>
          <div class="pwd-wrap">
            <input type="password" id="newPassword" placeholder="Minimum 8 characters" required>
            <button type="button" class="pwd-toggle" data-target="newPassword" title="Show/hide password">
              <svg id="eyeIcon1" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <div class="input-group">
          <label for="confirmPassword">Confirm Password <span style="color:var(--danger)">*</span></label>
          <div class="pwd-wrap">
            <input type="password" id="confirmPassword" placeholder="Re-enter your new password" required>
            <button type="button" class="pwd-toggle" data-target="confirmPassword" title="Show/hide password">
              <svg id="eyeIcon2" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <button id="resetBtn" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;">
          Update Password
        </button>
        <div id="statusMsg"></div>
      </div>

      <div id="successWrap" class="hidden" style="text-align:center; padding: 20px 0;">
        <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
        <h3 style="color: var(--accent-dark); font-family: var(--font-heading); margin-bottom: 8px;">Password Updated!</h3>
        <p style="color: var(--muted); font-size: 14px; margin-bottom: 24px;">Your password has been changed. You can now sign in with your new password.</p>
        <a href="login.html" class="btn btn-primary" style="display:inline-flex;">Go to Sign In</a>
      </div>
    </div>
  </div>
</section>

<script src="js/supabase-client.js?v=1.1.0"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const resetBtn     = document.getElementById('resetBtn');
  const statusMsg    = document.getElementById('statusMsg');
  const resetFormWrap = document.getElementById('resetFormWrap');
  const successWrap  = document.getElementById('successWrap');

  let passwordUpdated = false; // guard against post-signOut state change

  // Eye toggle for all password fields
  document.querySelectorAll('.pwd-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.innerHTML = isHidden
        ? '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>'
        : '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>';
    });
  });

  // Supabase picks up the recovery token from the URL hash automatically
  supabase.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Token is valid — let the user set a new password
      resetBtn?.addEventListener('click', async () => {
        const newPwd  = document.getElementById('newPassword').value;
        const confPwd = document.getElementById('confirmPassword').value;

        if (!newPwd || newPwd.length < 8) {
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = '⚠️ Password must be at least 8 characters.';
          return;
        }
        if (newPwd !== confPwd) {
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = '⚠️ Passwords do not match. Please try again.';
          return;
        }

        resetBtn.textContent = 'Updating...';
        resetBtn.disabled = true;

        const { error } = await supabase.auth.updateUser({ password: newPwd });

        if (error) {
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = '❌ Error: ' + error.message;
          resetBtn.textContent = 'Update Password';
          resetBtn.disabled = false;
        } else {
          passwordUpdated = true;          // ← prevent post-signOut error flash
          resetFormWrap.classList.add('hidden');
          successWrap.classList.remove('hidden');
          await supabase.auth.signOut();   // clean up session
        }
      });
    } else if (!session && !passwordUpdated) {
      // No valid recovery token and not just finished updating — show error
      statusMsg.className = 'status-msg error';
      statusMsg.textContent = '❌ Invalid or expired reset link. Please request a new one from the Sign In page.';
      resetBtn.disabled = true;
    }
  });
});
</script>
</body>
</html>
