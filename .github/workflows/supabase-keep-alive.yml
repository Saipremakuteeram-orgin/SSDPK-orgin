name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 6 hours (4x/day). Supabase pauses Free Plan projects that don't
    # get "a few user database requests each day" over a 7-day window — a single
    # ping every 3 days was no longer enough to prevent pausing.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/members?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase ping returned HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP $code — the project is likely paused."
            exit 1
          fi

  restore:
    needs: ping
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Restore paused project via Management API
        id: restore
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret not set — skipping auto-restore."
            echo "Restore manually at https://supabase.com/dashboard/project/zkzotagctwqthxypczej"
            exit 0
          fi
          ref=$(printf '%s' "${{ secrets.SUPABASE_URL }}" | sed -E 's#https://([^.]+)\.supabase\.co.*#\1#')
          status=$(curl -s "https://api.supabase.com/v1/projects/$ref" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | \
            sed -n 's/.*"status"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          echo "Project status: $status"
          if echo "$status" | grep -qiE 'inactive|paused'; then
            echo "Project is paused — requesting restore..."
            curl -s -X POST "https://api.supabase.com/v1/projects/$ref/restore" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "Project not paused ($status) — no restore needed."
          fi

      - name: Re-ping after restore
        if: steps.restore.outputs.restored == 'true'
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 \
              "${{ secrets.SUPABASE_URL }}/rest/v1/members?select=id&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
            echo "Re-ping attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Project is reachable again after restore."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Project still unreachable after restore attempt."
          exit 1
