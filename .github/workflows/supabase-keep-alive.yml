name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 03:00 UTC — well inside the 7-day pause window
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}   # lets you trigger it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep it active
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/members?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
